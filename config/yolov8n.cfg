[Common]
mode = build

[Parser]
model_type = ONNX
model_name = yolov8n
detection_postprocess = YOLO 
model_domain = OBJECT_DETECTION
input_data_format = NCHW
input_model = onnx_model/yolov8n_sim.onnx
input = images
output = output0
input_shape = [1, 3, 640, 640]
output_dir = ./out

[Optimizer]
dataset = numpydataset
calibration_data = datasets/calib_data.npy
calibration_batch_size = 2
output_dir = ./out
dump_dir = ./out
quantize_method_for_activation = per_tensor_asymmetric
quantize_method_for_weight = per_channel_symmetric_restricted_range
save_statistic_info = True
trigger_float_op = disable & <[(164, 181)]:float16_preferred!>
cast_dtypes_for_lib = True

[GBuilder]
target = X2_1204MP3
outputs = yolov8n.cix
tiling = fps